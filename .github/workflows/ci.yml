name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install (hash-checked lockfile)
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Tests on SQLite (local demo database)
        run: python -m pytest -q
      - name: Tests on PostgreSQL (migrations, RLS as vla_app)
        run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: |
          docker build -t vla-api:${{ github.sha }} backend
          docker build -t vla-web:${{ github.sha }} frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vla-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vla-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Compose smoke test (SQLite demo stack)
        run: |
          printf 'DEV_BFF_SHARED_SECRET=%s\nPOSTGRES_OWNER_PASSWORD=%s\nPOSTGRES_APP_PASSWORD=%s\nAI_ENABLED=false\nINSECURE_COOKIES=true\n' \
            "$(openssl rand -hex 24)" "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > .env
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS -o /dev/null http://localhost:3000/login
          docker compose exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz').read().decode())"
          docker compose exec -T api python -m app.ops.backup backup --db /app/data/vla.db --docs /app/data/documents --out /tmp/backups
          docker compose down -v
      - name: Compose smoke test (PostgreSQL + Redis + worker stack)
        run: |
          docker compose -f docker-compose.full.yml up -d --build --wait --wait-timeout 300
          curl -fsS -o /dev/null http://localhost:3000/login
          docker compose -f docker-compose.full.yml exec -T api python -c "import json, urllib.request; r = json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz')); assert r['cache'] == 'ok' and r['document_processing'] == 'queue', r; print(r)"
          docker compose -f docker-compose.full.yml exec -T worker python -m app.worker.admin counts
          test "$(docker compose -f docker-compose.full.yml exec -T db psql -U vla_owner -d vla -tAc "select count(*) from pg_stat_activity where usename = 'vla_app'")" -ge 1
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --tail 100 || true
          docker compose -f docker-compose.full.yml logs --tail 100 || true
      - name: Tear down
        if: always()
        run: |
          docker compose down -v || true
          docker compose -f docker-compose.full.yml down -v || true
