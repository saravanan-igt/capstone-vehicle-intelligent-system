# Requires the AWS Load Balancer Controller in the cluster. Only the BFF (web) is exposed; the API is internal.
# Idle timeout is raised above the BFF's 180 s slow-path timeout so in-request OCR is not cut off (A13).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /login
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=200
    # certificate-arn is set in the overlay.
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { name: http } }
