apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  # AWS access (Secrets Manager, future S3 documents) is bound by an EKS Pod Identity association in Terraform.
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  # SQLite has a single writer and the volume is ReadWriteOnce: exactly one pod, never two at once.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: vla-api
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: vla-config }
          env:
            - name: DEV_BFF_SHARED_SECRET
              valueFrom:
                {
                  secretKeyRef:
                    { name: vla-secrets, key: DEV_BFF_SHARED_SECRET },
                }
            - name: GEMINI_API_KEY
              valueFrom:
                {
                  secretKeyRef:
                    { name: vla-secrets, key: GEMINI_API_KEY, optional: true },
                }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: api-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8000, targetPort: http }
