# Non-secret settings. Secrets (DEV_BFF_SHARED_SECRET, GEMINI_API_KEY) live in the "vla-secrets"
# Secret, created out of band (kubectl or External Secrets from AWS Secrets Manager) - never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vla-config
data:
  DATABASE_URL: sqlite:////app/data/vla.db
  DOCUMENT_STORAGE_DIR: /app/data/documents
  AUTH_MODE: dev
  AI_ENABLED: "true"
  GEMINI_MODEL: gemini-2.5-flash
  GEMINI_TIMEOUT_MS: "15000"
  GEMINI_DOCUMENT_TIMEOUT_MS: "150000"
  MAX_UPLOAD_BYTES: "10485760"
  SEED_ON_STARTUP: "true"
  BACKEND_URL: http://api:8000
