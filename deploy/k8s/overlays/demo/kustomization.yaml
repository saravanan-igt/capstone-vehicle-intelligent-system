# Demo/staging overlay on EKS. AUTH_MODE=dev means anyone who can reach the login page can pick a demo
# user, so this overlay is for a restricted demo audience only - NOT production (OIDC is Phase 3, not built).
#
#   kubectl apply -k deploy/k8s/bootstrap                     # once, cluster admin
#   kubectl -n vla create secret generic vla-secrets \
#     --from-literal=DEV_BFF_SHARED_SECRET="$(openssl rand -hex 32)" --from-literal=GEMINI_API_KEY="<key>"
#   kubectl apply -k deploy/k8s/overlays/demo                 # CI deploy (namespace-scoped)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vla-api
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/vla-api
    newTag: CHANGE_ME
  - name: vla-web
    newName: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/vla-web
    newTag: CHANGE_ME
patches:
  - target: { kind: Ingress, name: web }
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:REGION:ACCOUNT_ID:certificate/CHANGE_ME
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1inbound-cidrs
        value: 203.0.113.0/24 # CHANGE_ME: restrict to the demo audience's egress CIDR(s)
  - target: { kind: PersistentVolumeClaim, name: api-data }
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: gp3
